# https://github.com/csark0812/skeleton — root config (preferred over .skeleton/config.yaml)

daysUntilStale = 365

[scan]
include = [
  "docs/**",
  "README.md",
  "AGENTS.md",
]
exclude = [
  "refs/**",
]

[deny]
paths = []

[reviewProof]
mode = "hash"
# lockfile = ".skeleton/review-lock.json"

# Defaults apply when this section is omitted. Empty include disables the gate.
# [reviewCoverage]
# include = ["**/*.{ts,tsx,js,jsx,mjs,cjs,py}", "package.json", "project.json"]
# exclude = ["**/__tests__/**", "**/*.test.*", "**/*.spec.*", "**/fixtures/**", "templates/**", "**/node_modules/**", "**/dist/**"]

# Optional: near-dupe / SSOT-summary tunables
# [docsLint]
# nearDuplicateThreshold = 0.72
# ssotOverlapMin = 0.35
# ignoreGlobs = ["docs/changelog/**"]

# Optional: skill body ownership (skills-lock.json github entries are foreign by default)
# [skillOwnership]
# lockfile = "skills-lock.json"
# ownedSlugs = []
# foreignSlugs = []

# Optional: plugin `.ts` entries relative to .skeleton/ (built sibling `.mjs` required)
# plugins = []
# Optional: draft-marker allow-list prefixes (plus `_draft-*.md` filenames)
# draftPathPrefixes = []
