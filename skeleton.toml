# Skeleton dogfood config (preferred). Legacy .skeleton/config.yaml ignored if both exist.

daysUntilStale = 365

[scan]
include = [
  "docs/**",
  "README.md",
  "AGENTS.md",
  "agent-suites/README.md",
  "skeleton/**",
]
exclude = [
  "refs/**",
  "docs/archive/**",
  "test-results/**",
  "editors/**",
  # Local skills-CLI install trees (not source) — avoid dual-SKILL dogfood fails
  ".agents/**",
  ".claude/**",
]

[reviewProof]
mode = "hash"

[reviewCoverage]
include = ["src/**/*.ts", "package.json"]
exclude = [
  "src/**/__tests__/**",
  "src/**/*.test.ts",
  "src/**/fixtures/**",
]

[deny]
paths = []
